name: Clone stats badge

on:
  schedule:
    - cron: "17 3 * * *"   # každý den ve 03:17 UTC
  workflow_dispatch:        # ruční spuštění z Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect clone stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # traffic API čte jen token s push přístupem
          GH_OWNER: ${{ github.repository_owner }}
        run: node clone-stats-tool/clone-badge.mjs .github/clone-stats/badge.json

      - name: Commit badge.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/clone-stats/badge.json
          git diff --staged --quiet || git commit -m "chore: update clone-stats badge"
          git push

      - name: Badge snippet (do README)
        run: |
          echo 'Přidej si do README:'
          echo "![clones](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/${{ github.repository }}/main/.github/clone-stats/badge.json)"
